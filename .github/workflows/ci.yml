name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests are hermetic by design
        # No Postgres, Redis, Qdrant or AI provider is started or contacted:
        # the suite substitutes in-memory fakes on purpose, so a green run here
        # is a real signal and not an integration test that needs services.
        run: python -m pytest

  cli:
    name: cli package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: The CLI must be installable exactly as a buyer installs it
        run: |
          python -m pip install --upgrade pip
          pip install ./cli
          astrocoda --help

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is what buyers actually run. Building it here means a broken
      # Dockerfile is caught in review rather than on a customer's machine.
      - name: Build
        run: docker build -t astrocoda:ci .

      - name: Compose config is valid
        run: docker compose config --quiet
