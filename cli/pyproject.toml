[project]
name = "astrocoda-cli"
version = "0.1.0"
description = "Scaffold an Astrocoda pipeline project from a signed, verified release"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Astrocoda contributors" }]
keywords = ["scaffolding", "boilerplate", "pipeline", "supply-chain", "code-signing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Security",
]
dependencies = ["cryptography>=42.0"]

[project.urls]
Homepage = "https://github.com/ivanbright/astrocoda"
Source = "https://github.com/ivanbright/astrocoda"
Changelog = "https://github.com/ivanbright/astrocoda/releases"
Issues = "https://github.com/ivanbright/astrocoda/issues"
Funding = "https://github.com/sponsors/ivanbright"

[project.scripts]
astrocoda = "astrocoda.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrocoda*"]
where = ["."]

[tool.setuptools.package-data]
astrocoda = ["*.pem"]
