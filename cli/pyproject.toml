[project]
name = "astrocoda-cli"
version = "0.1.0"
description = "Licensed CLI for the Astrocoda AI pipeline boilerplate (offline license check)"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0"]

[project.scripts]
astrocoda = "astrocoda.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrocoda*"]
where = ["."]

[tool.setuptools.package-data]
astrocoda = ["*.pem"]